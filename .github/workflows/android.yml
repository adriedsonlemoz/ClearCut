name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "work/**"

permissions:
  contents: write

concurrency:
  group: clearcut-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar APKs ARM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Instalar Android SDK 37.1
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-37.1"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.1/android.jar"

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Gerar APKs de debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Preparar APKs ARM separados
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          arm64="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*.apk' -print -quit)"
          armv7="$(find app/build/outputs/apk/debug -type f -name '*armeabi-v7a*.apk' -print -quit)"

          test -n "$arm64" || { echo "APK arm64-v8a não encontrado."; exit 1; }
          test -n "$armv7" || { echo "APK armeabi-v7a não encontrado."; exit 1; }

          cp "$arm64" "dist/ClearCut-3.81.9-arm64-v8a.apk"
          cp "$armv7" "dist/ClearCut-3.81.9-armeabi-v7a.apk"

          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f ! -name '*.apk' | wc -l)" -eq 0

          echo "APKs finais:"
          ls -lh dist/*.apk

      - name: Publicar APKs diretamente no Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v3.81.9"
          title="ClearCut 3.81.9"
          arm64="dist/ClearCut-3.81.9-arm64-v8a.apk"
          armv7="dist/ClearCut-3.81.9-armeabi-v7a.apk"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$arm64" "$armv7" --clobber
          else
            gh release create "$tag" "$arm64" "$armv7" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "APKs Android ARM separados. Use arm64-v8a em aparelhos Android modernos e armeabi-v7a em aparelhos ARM 32 bits."
          fi
